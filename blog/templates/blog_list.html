{% extends 'catalog/base.html' %}

{% load my_tags %}



{% block content %}

{% include 'catalog/includes/inc_title.html' %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Блог</h1>
    <a type="button" class="btn btn-lg btn-block btn-outline-primary" href="{% url 'blog:blog_create' %}">Добавить
        запись</a>
</div>

<div class="container">
    <div class="row text-center">
        {% for blog in object_list %}
        <div class="col-4 d-flex">
            <div class="card mb-4 box-shadow w-100">
                <div class="card-header">
                    <img src="{{ blog.preiew | media_filter }}">

                </div>
                <div class="card-body">
                    <h3 class="card-title pricing-card-title">{{blog.title}}</h3>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">

                        <p>{{blog.content|truncatechars:100}}</p>

                    </ul>
                    <button type="button" class="btn btn-lg btn-block btn-outline-primary">Подробнее</button>
                </div>
            </div>
        </div>
        {% endfor%}
    </div>
</div>
{% endblock%}
