{% extends 'catalog/base.html' %}

{% load my_tags %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Содержимое записи</h1>
</div>

{% block content %}

<div class="container">
    <div class="row text-center">
        <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="col-4 d-flex">
                    <div class="card mb-4 box-shadow w-100">
                        <div class="card-header">
                            <img src="{{ blog.image | media_filter }}">
                        </div>
                        <div class="card-body">
                            <h1 class="card-title pricing-card-title">{{ object.title }}</h1>
                            <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                                <p>{{ object.content|truncatechars:1000 }}</p>
                            </ul>
                            <h5 class="card-title">Вы действительно хотите удалить "{{ object.title }}"?</h5>
                            <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Подтвердить</button>
                            <a type="button" class="btn btn-outline-primary"
                                   href="{% url 'blog:blog_list' %}">Отменить</a>
                        </div>
                    </div>
                </div>
        </form>
    </div>
</div>
{% endblock%}
